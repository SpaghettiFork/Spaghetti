name: build and warnings

on:
  pull_request:
  push:
    branches:
      - ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            ccache \
            flex \
            gcc \
            libaudit-dev \
            libbsd-dev \
            libdbus-1-dev \
            libdrm-dev \
            libegl-dev \
            libepoxy-dev \
            libgbm-dev \
            libgl-dev \
            libpixman-1-dev \
            libselinux1-dev \
            libsystemd-dev \
            libtirpc-dev \
            libudev-dev \
            libunwind-dev \
            libx11-dev \
            libxau-dev \
            libxcvt-dev \
            libxdmcp-dev \
            libxext-dev \
            libxfixes-dev \
            libxfont-dev \
            libxi-dev \
            libxkbfile-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxshmfence-dev \
            libxtst-dev \
            libxv-dev \
            mesa-common-dev \
            meson \
            nettle-dev \
            ninja-build \
            pkg-config \
            python3 \
            x11proto-dev \
            xtrans-dev \
            xutils-dev \
            zlib1g-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: build-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-ccache-${{ runner.os }}-

      - name: Configure
        run: |
          export CC="ccache gcc"
          meson setup build-warn . \
            -Dwerror=false \
            -Dc_args="-Warray-bounds=2 -Wstringop-overflow=4 -Walloc-zero -Wuse-after-free=3 -Wdangling-pointer=2 -fanalyzer -Wanalyzer-use-after-free -Wanalyzer-double-free -Wanalyzer-out-of-bounds -Wanalyzer-use-of-uninitialized-value -Wno-error -Wno-error=array-bounds"

      - name: Build
        run: |
          set -o pipefail
          ninja -C build-warn 2>&1 | tee warn.log

      - name: Scope warnings
        if: success()
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git diff -U0 "$BASE"...HEAD > scope.diff || true
          python3 .github/scripts/warning-scope.py \
            --log warn.log \
            --diff scope.diff \
            --root . \
            --build-dir build-warn \
            --max 10 \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warning-log
          path: warn.log
